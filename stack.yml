version: "3.9"

services:
  arce:
    image: ghcr.io/paul1578/finalquintoa:1.0.0
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.arce.entrypoints=http"
        - "traefik.http.routers.arce.rule=Host(`arce.byronrm.com`)"
        - "traefik.http.middlewares.arce-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.arce.middlewares=arce-https-redirect"
        - "traefik.http.routers.arce-secure.entrypoints=https"
        - "traefik.http.routers.arce-secure.rule=Host(`arce.byronrm.com`)"
        - "traefik.http.routers.arce-secure.tls=true"
        - "traefik.http.routers.arce-secure.tls.certresolver=http"
        - "traefik.http.routers.arce-secure.service=arce"
        - "traefik.http.services.arce.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true